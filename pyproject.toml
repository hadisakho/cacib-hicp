[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cacib-hicp"
version = "1.0.0"
description = "Euro area HICP: Eurostat pipeline, 3-month headline forecast and shock pass-through simulator"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "arch>=7.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pyarrow>=14",
    "plotly>=5.20",
    "streamlit>=1.48",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "jupyterlab>=4",
    "ipykernel>=6",
    "nbformat>=5.9",
]

[tool.setuptools]
packages = ["hicp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["E741"]  # `I` is the price index, as in the formulas
